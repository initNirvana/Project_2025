server:
  port: 8081  # Spring Boot 애플리케이션 실행 포트

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/communitydb  # 로컬 MySQL 서버 주소
    username: root  # MySQL 사용자 이름
    password: rootpassword  # MySQL 비밀번호
    driver-class-name: com.mysql.cj.jdbc.Driver  # MySQL 드라이버 클래스
  jpa:
    hibernate:
      ddl-auto: none  # Flyway를 사용할 경우 Hibernate는 테이블 자동 생성하지 않음
    show-sql: true  # SQL 쿼리 로그 활성화

flyway:
  enabled: true  # Flyway 활성화
  baseline-on-migrate: true  # 기존 스키마를 기준으로 마이그레이션 시작
  locations: classpath:/db/migration  # 마이그레이션 파일 경로


